name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore MinionScaler/MinionScaler.csproj --configfile NuGet.Config

      - name: Download Dalamud
        shell: pwsh
        run: |
          $dalamudRoot = Join-Path $env:RUNNER_TEMP "dalamud"
          $zipPath = Join-Path $env:RUNNER_TEMP "dalamud.zip"
          New-Item -ItemType Directory -Force -Path $dalamudRoot | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile $zipPath
          Expand-Archive -LiteralPath $zipPath -DestinationPath $dalamudRoot -Force
          $devPath = Get-ChildItem -Path $dalamudRoot -Directory -Recurse |
            Where-Object { $_.FullName -match "[\\/]Hooks[\\/]dev$" } |
            Select-Object -First 1
          if (-not $devPath) {
            $devPath = Get-Item $dalamudRoot
          }
          "DALAMUD_HOME=$($devPath.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        run: dotnet build MinionScaler/MinionScaler.csproj -c Release --no-restore

      - name: Package plugin
        shell: pwsh
        run: |
          $project = "MinionScaler"
          $pluginDll = Get-ChildItem -Path "$project/bin" -Filter "MinionScaler.dll" -Recurse |
            Where-Object { $_.FullName -match "[\\/]Release[\\/]" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $pluginDll) {
            throw "MinionScaler.dll was not found in the Release output."
          }
          $releaseDir = $pluginDll.Directory

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $zip = Get-ChildItem -Path $releaseDir.FullName -Filter "MinionScaler*.zip" -Recurse | Select-Object -First 1
          if ($zip) {
            Copy-Item $zip.FullName artifacts/MinionScaler.zip -Force
          } else {
            Compress-Archive -Path "$($releaseDir.FullName)/*" -DestinationPath artifacts/MinionScaler.zip -Force
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path artifacts/MinionScaler.zip)).Entries |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      - name: Upload release asset
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/MinionScaler.zip

      - name: Checkout custom repository feed
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: main
          path: feed-main

      - name: Publish custom repository feed
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        run: |
          [xml]$projectXml = Get-Content MinionScaler/MinionScaler.csproj
          $version = [string]$projectXml.Project.PropertyGroup.Version
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"
          }

          $relativeFeedPath = ".dalamud/754623bc9780f1da0b27ed0a0968a170cee25b6a94cd0f2d/repo.json"
          $feedPath = Join-Path "feed-main" $relativeFeedPath
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/MinionScaler.zip"

          if (Test-Path -LiteralPath $feedPath) {
            $currentEntry = @(Get-Content -LiteralPath $feedPath -Raw | ConvertFrom-Json)[0]
            if ($currentEntry.AssemblyVersion -eq $version -and
                $currentEntry.DownloadLinkInstall -eq $downloadUrl) {
              Write-Host "Custom repository feed already points to $tag."
              exit 0
            }
          }

          ./scripts/make-repo-json.ps1 `
            -Owner "${{ github.repository_owner }}" `
            -Repository "${{ github.event.repository.name }}" `
            -Version $version `
            -Tag $tag `
            -OutputPath $feedPath

          Set-Location feed-main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $relativeFeedPath
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Custom repository feed is unchanged."
            exit 0
          }

          git commit -m "Update custom repository feed for $tag"
          git push origin HEAD:main
